<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusLink - University Network & Opportunities</title>
  <meta name="description" content="CampusLink is a student-focused professional platform connecting university students across Ethiopia and Africa with internships, research, study circles, and peer networks.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231d4ed8'><rect width='24' height='24' rx='6'/><text x='12' y='16' fill='white' font-size='11' font-family='sans-serif' font-weight='bold' text-anchor='middle'>CL</text></svg>">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core & Component Styles -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/feed.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/opportunities.css">
  <link rel="stylesheet" href="css/circles.css">
  <link rel="stylesheet" href="css/events.css">
  <link rel="stylesheet" href="css/research.css">
  <link rel="stylesheet" href="css/messaging.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/notifications.css">

  <!-- Optional Firebase SDK (Compatible with live cloud configurations) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body>
  <!-- Application Container -->
  <div id="app">
    <!-- Initial Loading Skeleton -->
    <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background-color: #f8fafc;">
      <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #1d4ed8, #0ea5e9); display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 1.25rem;">
        CL
      </div>
      <div style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.1rem; font-weight: 700; color: #0f172a;">
        CampusLink
      </div>
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Global Modal Host -->
  <div id="global-modal-backdrop" class="modal-backdrop"></div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Main ES Module Application Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
